<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Equipment Showcase</title>
<style>
  :root { color-scheme: dark; --bg: #0c0e11; --fg: #eaedf0; --mu: #9aa4b0; --ac: #F41C22; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 "Helvetica Neue", Arial, sans-serif;
         display: grid; place-items: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 34rem; }
  h1 { font-family: "Arial Black", Arial, sans-serif; font-size: clamp(1.6rem, 5vw, 2.4rem); line-height: 1.05; margin: 0 0 .6rem; text-transform: uppercase; }
  h1::after { content: ""; display: block; width: 3rem; height: 5px; background: var(--ac); margin-top: .8rem; }
  p { color: var(--mu); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Equipment showcase</h1>
  <p>Interactive equipment presentations and training pages. Each document is shared by its own direct link or QR code.</p>
</main>
</body>
</html>
